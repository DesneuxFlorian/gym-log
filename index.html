<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14171a">
<title>Gym Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f5; --card:#ffffff; --ink:#15191d; --ink2:#525a62; --muted:#808992; --line:#dde1e5;
  --accent:#1d6fb8; --accent-ink:#ffffff; --good:#1b7f4c; --warn:#b26a00; --bad:#c8372d; --chip:#e8ecef;
  --f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14171a; --card:#1d2125; --ink:#eef0f2; --ink2:#b5bcc3; --muted:#87909a; --line:#2d3237;
  --accent:#5aa3e6; --accent-ink:#0d1114; --good:#4cc38a; --warn:#e3a33b; --bad:#ef6b62; --chip:#272c31; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg)}
header h1{font-size:1.15rem;margin:0;flex:1;font-weight:700;letter-spacing:.01em}
.sync{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)}.dot.pend{background:var(--warn)}.dot.err{background:var(--bad)}
main{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:12px 0 14px;font-size:.85rem;color:var(--muted);font-weight:600}
nav button[aria-current="page"]{color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h2{font-size:1rem;margin:0 0 4px}
h3{font-size:.95rem;margin:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:12px 14px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.eyebrow{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.elapsed{font:700 1.6rem var(--mono);font-variant-numeric:tabular-nums}
.ex{display:flex;flex-direction:column;gap:6px}
.ex-head{display:flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;text-align:left;width:100%}
.ex-head h3{flex:1}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.set{font:13px var(--mono);background:var(--chip);border-radius:6px;padding:4px 8px;border:0}
.set.done{outline:1px solid var(--line)}
input[type=text],input[type=number],input[type=password],input[type=search],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px}
textarea{min-height:64px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink2)}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:6px;align-items:stretch}
.stepper input{text-align:center;font:700 1.5rem var(--mono);padding:6px}
.stepper button{border:1px solid var(--line);background:var(--chip);border-radius:8px;font-size:1.4rem;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-height:92%;overflow-y:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .bar{display:flex;align-items:center;gap:10px}
.sheet .bar h2{flex:1;margin:0;font-size:1.1rem}
.x{background:none;border:0;font-size:1.5rem;color:var(--muted);padding:4px 8px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.list button{display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:10px 0;font:600 15px var(--mono)}
.rpe button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pain{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.pain input[type=range]{width:100%;accent-color:var(--bad)}
.pain output{font:600 14px var(--mono);min-width:2ch;text-align:right}
.timer{position:fixed;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;display:flex;gap:12px;align-items:center;font:700 1.1rem var(--mono);z-index:25;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.timer button{background:none;border:0;color:inherit;font:600 .8rem var(--f);opacity:.8}
.timer.over{background:var(--good)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.stats{grid-template-columns:repeat(2,1fr);gap:12px}}
.last{font:13px var(--mono);color:var(--ink2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;font-size:.9rem;max-width:90%}
table{border-collapse:collapse;width:100%;font:13px var(--mono)}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="title">Gym Log</h1><div class="sync" id="sync"><span class="dot" id="syncdot"></span><span id="synctxt">local</span></div></header>
  <main id="main"></main>
  <nav>
    <button id="nav-today" aria-current="page">Workout</button>
    <button id="nav-history">History</button>
    <button id="nav-settings">Settings</button>
  </nav>
</div>
<div class="timer" id="timer" hidden><span id="timertxt">1:30</span><button id="timer-add">+30 s</button><button id="timer-stop">Stop</button></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="csvfile" accept=".csv,text/csv" hidden>
<script src="app.js"></script>
</body>
</html>
